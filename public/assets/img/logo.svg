<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Read Aloush">
  <title>Read Aloush</title>
  <!-- The mark: "ra", his initials, in lime on a dark disc.

       Lower case because it is friendlier and the two letters sit at one
       height, so they stay legible at the 16-pixel size of a browser tab.
       Drawn as strokes rather than outlined glyphs so the weight survives
       being scaled down. -->
  <circle cx="50" cy="50" r="48" fill="#0c0b10"/>
  <g fill="none" stroke="#C3E41D" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 70 V46 a14 14 0 0 1 14 -14 H40"/>
    <circle cx="63" cy="54" r="15"/>
    <path d="M78 38 V70"/>
  </g>
</svg>
