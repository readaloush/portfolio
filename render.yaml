services:
  - type: web
    name: read-alallos-portfolio
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "no build step — this project has no dependencies"
    startCommand: node server.js
    healthCheckPath: /healthz

    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORTFOLIO_DATA_DIR
        value: /var/data
      - key: PORTFOLIO_UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_USERNAME
        value: read
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: readaloush/portfolio
      - key: GITHUB_DATA_BRANCH
        value: data
