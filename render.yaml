# Render blueprint - Render reads this file and configures everything itself.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: read-alallos-portfolio
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "no build step - this project has no dependencies"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: read
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
